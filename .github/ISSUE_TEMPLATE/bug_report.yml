name: Bug report
description: Report a patch or nightly-build failure.
title: "bug: "
body:
  - type: textarea
    attributes:
      label: Problem and reproduction steps
    validations:
      required: true
  - type: textarea
    attributes:
      label: Waze version, bundle version, selected patches and device
    validations:
      required: true
  - type: textarea
    attributes:
      label: Build or patching log
      description: Remove account information and personal details before sharing.
