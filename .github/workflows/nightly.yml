name: Nightly Waze release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild an already published version (artifacts only; never replaces a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: waze-nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.upstream.outputs.build }}
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ci/requirements.txt
      - run: python -m unittest discover -s ci/tests -v
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          args=()
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          python ci/upstream.py check "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-metadata
          path: build/upstream.json
      - name: Check summary
        env:
          BUILD: ${{ steps.upstream.outputs.build }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          if [[ "$BUILD" == "true" ]]; then
            echo "Building $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$TAG is already released. Download, build and publishing skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r ci/requirements.txt
      - name: Restore checked upstream metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name upstream-metadata --dir build
      - name: Download original ARM64 package
        run: python ci/upstream.py download
      - name: Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Restore persistent signing key
        env:
          WAZE_KEYSTORE_BASE64: ${{ secrets.WAZE_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['WAZE_KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Missing WAZE_KEYSTORE_BASE64 repository secret')
          path = Path(os.environ['RUNNER_TEMP']) / 'waze-release.p12'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Build and validate all four patches
        env:
          WAZE_STORE_PASSWORD: ${{ secrets.WAZE_STORE_PASSWORD }}
          WAZE_KEY_PASSWORD: ${{ secrets.WAZE_KEY_PASSWORD }}
          WAZE_RELEASE_CERT_SHA256: ${{ vars.WAZE_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -o pipefail
          python ci/build.py --keystore "$RUNNER_TEMP/waze-release.p12" 2>&1 | tee build/nightly.log
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: python ci/publish.py
      - name: Preserve build results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waze-build-${{ github.run_id }}
          retention-days: 14
          path: |
            dist/nightly/
            build/upstream.json
            build/nightly.log
      - name: Remove runner signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/waze-release.p12"

  source:
    name: Update Morphe source
    needs: [check, build]
    if: always() && needs.check.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Publish metadata for the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: python ci/source.py
